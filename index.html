<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>呆呆獸擠擠</title>
<style>
  :root{
    --card:#fff8ef; --ink:#5a3a2a; --accent:#f27f95; --accent2:#f5a442; --muted:#a3806a;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#4b9fb9;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;color:var(--ink)}
  canvas{display:block;position:fixed;inset:0}
  #fx{pointer-events:none}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));
    pointer-events:none;z-index:2}
  /* 手機：HUD 縮小，關卡名稱藏起來，避免按鈕被擠出畫面 */
  @media (max-width:520px){
    #hud{gap:5px;padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right));font-size:clamp(12px,3.9vw,15px)}
    #lvl,#fill{padding:.45em .75em}
    #lvl small{display:none}
    #hud button{padding:.4em .5em;border-radius:12px;font-size:clamp(13px,4.2vw,16px)}
    #tip{font-size:12px;bottom:calc(6px + env(safe-area-inset-bottom))}
    .card{padding:18px 14px 14px}
    #grid{gap:7px}
    #grid button{padding:9px 2px;font-size:17px}
  }
  #lvl{background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;
    box-shadow:0 3px 0 rgba(90,50,20,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #lvl small{color:var(--muted);font-weight:700;margin-left:6px}
  #fill{background:var(--card);border-radius:999px;padding:8px 12px;font-weight:800;
    box-shadow:0 3px 0 rgba(90,50,20,.25);white-space:nowrap}
  .sp{flex:1}
  button{pointer-events:auto;border:0;cursor:pointer;font:inherit;font-weight:800;color:var(--ink);
    background:var(--card);border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 rgba(90,50,20,.25);
    transition:transform .08s}
  #hud button[disabled]{opacity:.45;cursor:default}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,50,20,.25)}
  button.primary{background:var(--accent);color:#fff}
  #tip{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:13px;font-weight:700;
    color:#fff;text-shadow:0 1px 2px rgba(80,40,10,.6);pointer-events:none;z-index:2;padding:0 16px}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;
    background:rgba(15,50,75,.45);padding:16px}
  .ov.show{display:flex}
  .card{background:var(--card);border-radius:24px;padding:22px 22px 18px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 8px 0 rgba(90,50,20,.3);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .card h2{margin:4px 0 6px;font-size:26px}
  .card p{margin:6px 0;color:var(--muted);font-weight:700}
  .stars{font-size:38px;letter-spacing:6px;margin:4px 0}
  .stars .off{filter:grayscale(1);opacity:.3}
  .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  #grid button{padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px}
  #grid button small{font-size:11px;color:var(--muted)}
  #grid button[disabled]{opacity:.45;cursor:default}
  #grid button.done{background:#ffe2b8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="lvl">第 1 關</div>
  <div id="fill">0 / 0</div>
  <div class="sp"></div>
  <button id="bUndo" title="復原 (Ctrl+Z)">↶</button>
  <button id="bHint" title="提示">💡</button>
  <button id="bReset" title="重來">↻</button>
  <button id="bSound" title="音效">🔊</button>
  <button id="bMenu" title="選關">☰</button>
</div>
<div id="tip">拖曳呆呆獸放上小島的石板 · 點一下旋轉（拖曳中可按 R / 右鍵 / 滾輪）· 填滿所有格子就過關！</div>

<div class="ov" id="winOv"><div class="card">
  <div class="stars" id="stars"></div>
  <h2>全部擠上島了！</h2>
  <p id="winInfo"></p>
  <div class="row">
    <button id="bAgain">再玩一次</button>
    <button id="bNext" class="primary">下一關 ▶</button>
  </div>
</div></div>

<div class="ov" id="ruleOv"><div class="card">
  <div class="stars" id="ruleIcon"></div>
  <h2>新規則！</h2>
  <p id="ruleTxt" style="color:var(--ink);line-height:1.7"></p>
  <div class="row"><button id="bRule" class="primary">知道了</button></div>
</div></div>

<div class="ov" id="menuOv"><div class="card">
  <h2>🐾 選擇關卡</h2>
  <p>把每隻呆呆獸都擠上小島，一塊石板都不能空！</p>
  <div id="grid"></div>
  <div class="row"><button id="bClose">關閉</button></div>
</div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');

/* ---------- 關卡：每個字母是一隻貓（同字母 = 同一隻），'.' 是不能放的位置 ----------
   關卡由「解答」直接定義，所以一定有解。 */
const LEVELS = [
  /* 大多是俄羅斯方塊形狀（四格），少數兩、三格的小傢伙補空位。
     規則關：tiles 標出特殊石板（T 王座 / W 木板 / C 咖哩），who 指定字母是哪一種呆呆獸（CATS 索引），feud:1 = 兩隻王不能相鄰 */
  { name:'第一次見面', map:['AAB','AAB','CCB'] },
  { name:'小沙發', map:['ABBB','AAAB','CCCC'] },
  { name:'方方小島', map:['ABBC','ABBC','AADC','DDDC'] },
  { name:'呆呆午睡', map:['AABBC','DAABC','DDEBC','DEEEC'] },
  { name:'有水窪的島', map:['.ABB.','CAABD','CCABD','CEEDD','.EE..'] },
  { name:'王座', map:['ABBBC','AABDC','EADDC','EEEDC'], tiles:['....T','.....','.....','.....'], who:{C:4},
    intro:['👑','戴白色貝殼王冠的<b>呆呆王</b>很講究：<br>牠的<b>頭</b>一定要坐在紅色<b>王座</b>上，<br>而且別人不准坐王座！'] },
  { name:'十字小島', map:['.ABB.','CABBD','CADDD','CAEFF','.EEE.'] },
  { name:'呆呆方塊', map:['AAABB','CADDB','CCDDB','ECFFG','EEEFG'] },
  { name:'木板橋', map:['ABCDD','ABCCD','ABBCD','AEFFG','EEEFG'], tiles:['.....','.....','WWWWW','.....','.....'], who:{E:3},
    intro:['🪵','背著灰色大殼的<b>超級呆殼獸</b>太重了，<br>任何一格都<b>不能壓在木板</b>上！'] },
  { name:'階梯島', map:['A.....','AA....','BAC...','BBCD..','EBCDD.','EECDFF'] },
  { name:'大家族', map:['AABBBB','CAADDE','CCFDDE','CGFFEE','GGGFHH'] },
  { name:'咖哩香', map:['AABBC','ABBDC','AE.DC','EEDDC','EFFFF'], tiles:['.....','....C','.....','.....','.....'], who:{C:1},
    intro:['🍛','黃色頭頂的<b>伽勒爾呆呆獸</b>是個貪吃鬼，<br>牠的<b>頭</b>要放在<b>咖哩</b>上或咖哩旁邊！'] },
  { name:'愛心島', map:['.AA.BC.','DAABBCC','DDDBEEC','.FFFEE.','..FGG..','...G...'] },
  { name:'終極擠擠', map:['.AABB.','CADBBE','CADDDE','CFGGEE','CFFGGH','.FIIIH'] },
  { name:'王的對決', map:['AAABB','CCABB','DCCEF','DGEEF','DGEFF','DGGHH'], tiles:['T....','.....','.....','.....','.....','.....'], who:{A:4,H:5}, feud:1,
    intro:['⚡','紫色王冠的<b>伽勒爾呆呆王</b>和<b>呆呆王</b>水火不容，<br>兩隻<b>不能相鄰</b>，一碰到就吵架！'] },
  { name:'甜甜圈島', map:['ABBCCD','AABBCD','AE..CD','FE..GD','FEEHGG','FFHHHG'] },
  { name:'長尾巴出沒', map:['ABBCC.','AABBC.','DAEFCG','DDEFFG','DHEEFG','.HIIIG'] },
  { name:'王宮', map:['ABBCCD','AABBCD','EA..CD','EE..FD','EGFFFH','GGGHHH'], tiles:['......','..WW..','.W....','.W....','.C....','T.....'], who:{C:5,E:1,G:4,H:3}, feud:1,
    intro:['🏰','所有規則一起上！<br>王座、木板、咖哩，還有兩隻吵架的王。'] },
  { name:'菱形島', map:['...A...','..AAB..','.CCABD.','CCEFBDD','.EEFBD.','..EGG..','...G...'] },
  { name:'環礁', map:['..AAAA..','.BBCCCD.','BBE..CDD','EEE..FFD','.GGGHFF.','..GHHH..'] },
  { name:'呆山呆海', map:['AAABCCD','AEFBBCD','EEFBGCD','EHFFGGD','IHHJJGK','IHJJKKK'] },
  { name:'呆呆王國', map:['ABCCDD','ABBCCD','AEBFGD','AEFFGG','EEHFIG','JJHHIK','JJHIIK'], tiles:['....T.','.....W','.....W','..W..W','..W..W','C....W','......'], who:{D:4,E:1,I:5,J:3}, feud:1 },
];

const CATS = [
  {name:'呆呆獸',       body:'#f4a3b4', head:'#f4a3b4', muzzle:'#efe1c0', tail:'#f4a3b4', tip:'#f8ece2', pers:{pitch:.7,spd:.45,wig:.8,look:.3,tilt:.35,mouth:.025,lag:.7,say:['……','呀～？','肚子餓了…','（放空中）','尾巴好癢…'],pick:['……？','……咦，我在飛？'],place:['好舒服～','……睡覺。']}},
  {name:'伽勒爾呆呆獸', body:'#f2a6c2', head:'#f2a6c2', headTop:'#f3d93a', muzzle:'#eadfb8', tail:'#f2a6c2', tip:'#f3d93a', pers:{pitch:1.25,spd:1.3,wig:1.15,look:.8,tilt:.22,sniff:true,say:['聞聞～','那是什麼？','有咖哩的味道！','好想到處看看！'],pick:['哇～飛起來了！','要去哪裡？'],place:['這裡好香！','耶！']}},
  {name:'伽勒爾呆殼獸', body:'#e99ac6', head:'#e99ac6', headTop:'#8b6bb8', muzzle:'#dccbe9', tail:'#e99ac6', tip:'#8b6bb8', bands:'#8b6bb8', belly:'#eee6bf', shellder:true, pers:{pitch:.95,spd:1.1,wig:.9,look:.3,tilt:.12,stomp:true,say:['看我的肌肉！','哼！','大舌貝準備！','衝啊！'],pick:['放我下來單挑！','喝！'],place:['穩穩的！','站好了！']}},
  {name:'超級呆殼獸',   body:'#cfd9df', spots:'#8f9aa1', head:'#f29aa6', muzzle:'#f3e3a8', tail:'#f29aa6', tip:'#f3e3a8', paw:'#f29aa6', spikes:true, megaShell:true, pers:{pitch:.6,spd:.55,wig:.3,look:.15,tilt:.06,heavy:true,say:['殼好重…','咕嚕…','別戳我的殼','慢慢來…'],pick:['好…重……','小心我的殼'],place:['咚！','安穩了…']}},
  {name:'呆呆王',       body:'#f2a39b', head:'#f2a39b', muzzle:'#f4e3a0', tail:'#f2a39b', tip:'#f2a39b', crown:'king', ruff:true, pers:{pitch:.85,spd:.7,wig:.4,look:.2,tilt:.05,regal:true,say:['朕在思考。','智慧，即是力量。','嗯，甚好。','稍安勿躁。'],pick:['注意禮節。','朕自己會走。'],place:['此位甚好。','準。']}},
  {name:'伽勒爾呆呆王', body:'#ec9fc6', head:'#9b86c4', muzzle:'#9b86c4', tail:'#ec9fc6', tip:'#8a74b5', paw:'#9b86c4', crown:'galar', cape:'#4b3a78', belly:'#e9e3b8', sly:true, pers:{pitch:1,spd:1.15,wig:.7,look:.5,tilt:.3,sly:true,say:['呵呵呵～','一切盡在掌握…','愚蠢的呆呆獸們','計畫通。'],pick:['你竟敢碰本王？','有意思…'],place:['正如我所料。','呵，完美。']}},
];

/* ---------- 小工具 ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(P,x,y,w,h,r){ r=Math.min(r,w/2,h/2); P.moveTo(x+r,y); P.arcTo(x+w,y,x+w,y+h,r); P.arcTo(x+w,y+h,x,y+h,r);
  P.arcTo(x,y+h,x,y,r); P.arcTo(x,y,x+w,y,r); P.closePath(); }
const K = (r,c) => r*100+c;
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('moviecat-progress')) || {}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem('moviecat-progress', JSON.stringify(v)); }catch(e){} }
};
let progress = Object.assign({unlocked:1, stars:{}}, store.get());

/* ---------- 音效 ---------- */
let AC = null, muted = false;
function audioInit(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(f1,f2,dur,type='sine',vol=.12,delay=0){
  if(!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  pick(pt=1){ tone(520*pt,760*pt,.08,'triangle',.07); },
  rot(){ tone(640,900,.06,'triangle',.06); },
  place(pt=1){ tone(700*pt,1050*pt,.09,'sine',.1); tone(1050*pt,620*pt,.18,'sine',.08,.08); },
  bad(){ tone(220,150,.14,'square',.035); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,f*1.01,.25,'triangle',.09,i*.1)); }
};

/* ---------- 遊戲狀態 ---------- */
let W=0,H=0,DPR=1,S=60,BX=0,BY=0,TS=.7, trayRect={x:0,y:0,w:0,h:0};
let level=0, board=null, pieces=[], drag=null, hover=null, won=false, moves=0, hints=0, startT=0;
let particles=[], floorCv=null, t0=performance.now();

function parseLevel(i){
  const L = LEVELS[i], tp = m => [...m[0]].map((_,c) => m.map(s => s[c] || '.').join(''));
  let map = L.map, tl = L.tiles || [];
  if(L.tr){ map = tp(map); if(tl.length) tl = tp(tl); }
  const rows = map.length, cols = Math.max(...map.map(s=>s.length));
  const on = new Set(), groups = {}, tile = new Map();
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const ch = map[r][c] || '.';
    if(ch === '.') continue;
    on.add(K(r,c)); (groups[ch] = groups[ch] || []).push([r,c]);
    const tc = (tl[r] || '')[c]; if(tc && tc !== '.') tile.set(K(r,c), tc);
  }
  const tv = [...tile.values()];
  return { rows, cols, on, total:on.size, groups:Object.entries(groups), tile, who:L.who || {},
    throne:tv.includes('T'), wood:tv.includes('W'), curry:tv.includes('C'), feud:!!L.feud };
}

function dims(p){ let h=0,w=0; for(const [r,c] of p.cells){ if(r+1>h)h=r+1; if(c+1>w)w=c+1; } return {w,h}; }
function rebuild(p){ p.set = new Set(p.cells.map(([r,c])=>K(r,c))); }
function has(p,r,c){ return r>=0 && c>=0 && p.set.has(K(r,c)); }
function rotateCells(p){ const {h}=dims(p); p.cells = p.cells.map(([r,c])=>[c,h-1-r]); rebuild(p); }

function makePiece(id, sol, R, force){
  const minR = Math.min(...sol.map(a=>a[0])), minC = Math.min(...sol.map(a=>a[1]));
  const p = { id, sol, cells: sol.map(([r,c])=>[r-minR,c-minC]), placed:null,
    x:0,y:0,dx:0,dy:0,sc:TS,dsc:0, rotAnim:0, delay:id*0.06, patches:[] };
  rebuild(p);
  // 頭：只有一個鄰居的格子；尾：離頭最遠的格子
  const nb = i => p.cells.map((q,j)=>j).filter(j => Math.abs(p.cells[j][0]-p.cells[i][0]) + Math.abs(p.cells[j][1]-p.cells[i][1]) === 1);
  const ends = p.cells.map((q,i)=>i).filter(i => nb(i).length === 1);
  p.head = force ?? (ends.length ? ends[Math.floor(R()*ends.length)] : 0);
  const dist = new Array(p.cells.length).fill(-1); dist[p.head]=0; const qu=[p.head];
  while(qu.length){ const i=qu.shift(); for(const j of nb(i)) if(dist[j]<0){ dist[j]=dist[i]+1; qu.push(j); } }
  p.tail = dist.indexOf(Math.max(...dist));
  p.dist = dist; p.sq = 9;
  for(let i=0;i<p.cells.length;i++) if(R()<.75) p.patches.push({i, fx:R()*.6-.3, fy:R()*.6-.3, r:.18+R()*.16, k:Math.floor(R()*2)});
  const rots = Math.floor(R()*4); for(let k=0;k<rots;k++) rotateCells(p);
  return p;
}

function loadLevel(i){
  level = i; board = parseLevel(i); won = false; moves = 0; hints = 0; startT = performance.now();
  drag = null; hover = null; particles = []; history = [];
  const R = rng(1234 + i*977);
  // 有規則的種類只能是關卡指定的那隻，其他隨機分配時要避開
  const ban = new Set(); if(board.throne) ban.add(4); if(board.wood) ban.add(3); if(board.curry) ban.add(1); if(board.feud){ ban.add(4); ban.add(5); }
  const pal = CATS.map((c,k)=>k).filter(k => !ban.has(k)); for(let k=pal.length-1;k>0;k--){ const j=Math.floor(R()*(k+1)); [pal[k],pal[j]]=[pal[j],pal[k]]; }
  bubbles = []; let n = 0;
  pieces = board.groups.map(([ch,g],k) => {
    const kind = board.who[ch] ?? pal[n++ % pal.length];
    const p = makePiece(k, g, R, headFor(kind, g)); p.kind = kind; p.col = CATS[kind]; return p; });
  // 托盤中的順序打亂
  for(let k=pieces.length-1;k>0;k--){ const j=Math.floor(R()*(k+1)); [pieces[k],pieces[j]]=[pieces[j],pieces[k]]; }
  $('#winOv').classList.remove('show');
  setTip();
  const L = LEVELS[i];
  if(L.intro && !introSeen.has(i) && !progress.stars[i]){
    introSeen.add(i); $('#ruleIcon').textContent = L.intro[0]; $('#ruleTxt').innerHTML = L.intro[1]; $('#ruleOv').classList.add('show'); }
  updateHud(); updateUndo();
  layout(true);   // 放在 HUD、說明文字更新之後，版面才會量到正確的高度
}
/* 底部說明：規則關列出規則，窄螢幕用短版 */
function setTip(){
  const n = innerWidth < 520, rl = [];
  if(board.throne) rl.push(n ? '👑 呆呆王頭坐王座' : '👑 呆呆王的頭要坐王座');
  if(board.wood) rl.push(n ? '🪵 超級呆殼獸不壓木板' : '🪵 超級呆殼獸不能壓木板');
  if(board.curry) rl.push(n ? '🍛 伽勒爾呆呆獸頭碰咖哩' : '🍛 伽勒爾呆呆獸的頭要碰到咖哩');
  if(board.feud) rl.push(n ? '⚡ 兩王不相鄰' : '⚡ 兩隻王不能相鄰');
  $('#tip').textContent = rl.length ? rl.join(' · ') : TIP;
}
const TOUCH = matchMedia('(pointer:coarse)').matches;
const TIP = TOUCH ? '拖曳呆呆獸放上小島的石板 · 點一下旋轉 · 填滿所有格子就過關！' : document.querySelector('#tip').textContent, introSeen = new Set();

/* 規則關：決定頭在哪一格，讓解答一定合規 */
function headFor(kind, sol){
  const T = (r,c) => board.tile.get(K(r,c));
  const isEnd = i => sol.filter(q => Math.abs(q[0]-sol[i][0]) + Math.abs(q[1]-sol[i][1]) === 1).length === 1;
  const idx = sol.map((q,i)=>i);
  let cand = [];
  if(kind === 4 && board.throne) cand = idx.filter(i => T(...sol[i]) === 'T');
  else if(kind === 1 && board.curry) cand = idx.filter(i => NEAR.some(([a,b]) => T(sol[i][0]+a, sol[i][1]+b) === 'C'));
  const e = cand.filter(isEnd);
  return e.length ? e[0] : cand.length ? cand[0] : undefined;
}
const NEAR = [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
/* 放在 (r0,c0) 會不會違反個性規則？違反就回傳牠要說的話 */
function ruleFail(p, r0, c0){
  const T = (r,c) => board.tile.get(K(r,c)), abs = p.cells.map(([r,c]) => [r0+r, c0+c]), [hr,hc] = abs[p.head];
  if(p.kind !== 4 && abs.some(([r,c]) => T(r,c) === 'T')) return '那是呆呆王的王座…';
  if(p.kind === 4 && board.throne && T(hr,hc) !== 'T') return '朕的頭要坐在王座上。';
  if(p.kind === 3 && abs.some(([r,c]) => T(r,c) === 'W')) return '木板會被我壓垮…';
  if(p.kind === 1 && board.curry && !NEAR.some(([a,b]) => T(hr+a,hc+b) === 'C')) return '咖哩呢？頭要靠近咖哩！';
  if(board.feud && (p.kind === 4 || p.kind === 5)){
    const foe = p.kind === 4 ? 5 : 4, occ = occupancy(p);
    for(const [r,c] of abs) for(const [a,b] of NEAR){ const q = occ.get(K(r+a,c+b)); if(q && q.kind === foe) return p.kind === 4 ? '朕不想跟牠當鄰居。' : '哼！離那個假國王遠一點！'; }
  }
  return null;
}
function ruleHint(p){
  if(p.kind === 4 && board.throne) return '朕要坐王座。';
  if(p.kind === 3 && board.wood) return '我太重了，別放木板上…';
  if(p.kind === 1 && board.curry) return '咖哩！我要聞咖哩！';
  if(board.feud && (p.kind === 4 || p.kind === 5)) return '別讓我靠近那傢伙。';
  return null;
}
const legal = (p,r,c) => fits(p,r,c) && !ruleFail(p,r,c);

/* ---------- 復原 ---------- */
let history = [];
const snap = () => JSON.stringify(pieces.map(p => [p.id, p.cells, p.placed]));
function commit(before){ if(before !== snap()){ history.push(before); if(history.length > 300) history.shift(); } updateUndo(); }
function updateUndo(){ const b = $('#bUndo'); if(b) b.disabled = !history.length || won; }
function undo(){
  if(won || drag || !history.length) return;
  for(const [id,cells,pl] of JSON.parse(history.pop())){
    const p = pieces.find(q => q.id === id); p.cells = cells; rebuild(p);
    if(pl){ p.placed = pl; p.x = BX+pl.c*S; p.y = BY+pl.r*S; p.sc = 1; } else sendHome(p);
  }
  sfx.rot(); updateHud(); updateUndo();
}

/* ---------- 版面配置 ---------- */
function pack(rect,u,gap){
  const items = [...pieces].sort((a,b)=>{ const da=dims(a),db=dims(b); return Math.max(db.w,db.h)-Math.max(da.w,da.h) || a.id-b.id; });
  const rows=[]; let cur={items:[],w:0,h:0};
  for(const p of items){
    const d=dims(p), s=Math.max(d.w,d.h)*u;
    if(s > rect.w) return null;
    if(cur.items.length && cur.w + gap + s > rect.w){ rows.push(cur); cur={items:[],w:0,h:0}; }
    cur.w += (cur.items.length?gap:0) + s; cur.h = Math.max(cur.h,s); cur.items.push({p,s});
  }
  if(cur.items.length) rows.push(cur);
  const totalH = rows.reduce((a,r)=>a+r.h,0) + gap*(rows.length-1);
  if(totalH > rect.h) return null;
  let y = rect.y + (rect.h-totalH)/2;
  for(const row of rows){
    let x = rect.x + (rect.w-row.w)/2;
    for(const it of row.items){ it.p.slot = {cx:x+it.s/2, cy:y+row.h/2}; x += it.s + gap; }
    y += row.h + gap;
  }
  return true;
}

function layout(fresh){
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio||1, 2);
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px';
  // 上下留白跟著 HUD、底部說明文字的實際高度走（手機瀏海、說明換行都不會被蓋到）
  const top = $('#hud').getBoundingClientRect().bottom + 2;
  const bottom = Math.max(36, H - $('#tip').getBoundingClientRect().top + 6), pad = W < 400 ? 10 : 14;
  const land = W > H*1.1;
  let br;
  if(land){
    const bw = (W - pad*3)*0.55;
    br = {x:pad, y:top, w:bw, h:H-top-bottom};
    trayRect = {x:pad*2+bw, y:top, w:W-bw-pad*3, h:H-top-bottom};
  } else {
    const bh = (H-top-bottom)*0.52;
    br = {x:pad, y:top, w:W-pad*2, h:bh};
    trayRect = {x:pad, y:top+bh+6, w:W-pad*2, h:H-top-bottom-bh-6};
  }
  S = Math.min(br.w/(board.cols+1), br.h/(board.rows+1), 104);
  let ok = false;
  for(let tries=0; tries<12 && !ok; tries++){
    for(let ts=1; ts>=.42; ts-=.04){ if(pack(trayRect, S*ts, Math.max(8,S*.18))){ TS=ts; ok=true; break; } }
    if(!ok) S *= .92;
  }
  if(!ok){ TS=.42; pack({x:trayRect.x,y:trayRect.y,w:trayRect.w,h:1e6}, S*TS, 8); }
  BX = br.x + (br.w - board.cols*S)/2; BY = br.y + (br.h - board.rows*S)/2;
  for(const p of pieces){
    if(p.placed){ p.x = BX+p.placed.c*S; p.y = BY+p.placed.r*S; p.sc = 1; }
    else sendHome(p, true);
    if(fresh){ p.dx=p.x; p.dy=p.y; p.dsc=0; }
    else if(!(drag && drag.p===p)){ p.dx=p.x; p.dy=p.y; p.dsc=p.sc; }
  }
  buildFloor(); resizeFx();
}

function sendHome(p, silent){
  const d = dims(p), u = S*TS;
  p.placed = null; p.sc = TS;
  p.x = p.slot.cx - d.w*u/2; p.y = p.slot.cy - d.h*u/2;
}

/* ---------- 盤面邏輯 ---------- */
function occupancy(except){
  const occ = new Map();
  for(const p of pieces) if(p.placed && p!==except) for(const [r,c] of p.cells) occ.set(K(p.placed.r+r,p.placed.c+c), p);
  return occ;
}
function fits(p,r0,c0){
  const occ = occupancy(p);
  for(const [r,c] of p.cells){ const k=K(r0+r,c0+c); if(r0+r<0||c0+c<0||!board.on.has(k)||occ.has(k)) return false; }
  return true;
}
function filled(){ let n=0; for(const p of pieces) if(p.placed) n+=p.cells.length; return n; }
function place(p,r,c){
  p.placed = {r,c}; p.x = BX+c*S; p.y = BY+r*S; p.sc = 1; p.sq = 0;
  const hc = p.cells[p.head]; heart(BX+(c+hc[1]+.5)*S, BY+(r+hc[0]+.2)*S);
  sfx.place(p.col.pers && p.col.pers.pitch); say(p,'place'); updateHud();
  if(filled() === board.total) win();
}
function anchorOf(p){ return { r:Math.round((p.y-BY)/S), c:Math.round((p.x-BX)/S) }; }
function overBoard(p){
  const d=dims(p);
  return p.x+d.w*S > BX-S*.3 && p.x < BX+board.cols*S+S*.3 && p.y+d.h*S > BY-S*.3 && p.y < BY+board.rows*S+S*.3;
}

function rotate(p){
  if(won) return;
  const u = S*p.dsc, od = dims(p);
  if(drag && drag.p===p && drag.moved){
    const lx = drag.lx, ly = drag.ly; rotateCells(p); drag.lx = od.h - ly; drag.ly = lx;
  } else if(p.placed){
    const cx = p.x+od.w*S/2, cy = p.y+od.h*S/2; rotateCells(p); const d = dims(p);
    p.placed = null; p.x = cx-d.w*S/2; p.y = cy-d.h*S/2;
    const a = anchorOf(p), why = fits(p,a.r,a.c) ? ruleFail(p,a.r,a.c) : null;
    if(fits(p,a.r,a.c) && !why){ place(p,a.r,a.c); } else { sendHome(p); sfx.bad(); if(why) say(p,'rule',why); }
    moves++; updateHud();
  } else { rotateCells(p); sendHome(p); }
  const nd = dims(p);
  p.dx += (od.w-nd.w)*u/2; p.dy += (od.h-nd.h)*u/2;
  p.rotAnim = Math.PI/2; sfx.rot();
}

function hint(){
  if(won) return;
  const ok = p => p.placed && p.cells.every(([r,c]) => p.sol.some(([sr,sc]) => sr===p.placed.r+r && sc===p.placed.c+c));
  const p = pieces.find(q => !ok(q));
  if(!p) return;
  const want = new Set(p.sol.map(([r,c])=>K(r,c)));
  for(const q of pieces) if(q!==p && q.placed && q.cells.some(([r,c])=>want.has(K(q.placed.r+r,q.placed.c+c)))) sendHome(q);
  const minR = Math.min(...p.sol.map(a=>a[0])), minC = Math.min(...p.sol.map(a=>a[1]));
  p.cells = p.sol.map(([r,c])=>[r-minR,c-minC]); rebuild(p);
  pieces.splice(pieces.indexOf(p),1); pieces.push(p);
  hints++; place(p,minR,minC);
}

function win(){
  won = true; drag = null; sfx.win(); updateUndo();
  const secs = Math.round((performance.now()-startT)/1000);
  const st = hints===0 ? 3 : hints<=2 ? 2 : 1;
  progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, level+2));
  progress.stars[level] = Math.max(progress.stars[level]||0, st);
  store.set(progress);
  for(let k=0;k<40;k++) confetti();
  setTimeout(() => {
    $('#stars').innerHTML = [0,1,2].map(i=>`<span class="${i<st?'':'off'}">⭐</span>`).join('');
    $('#winInfo').textContent = `第 ${level+1} 關「${LEVELS[level].name}」 · 用時 ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} · 調整 ${moves} 次` + (hints?` · 提示 ${hints} 次`:'');
    $('#bNext').style.display = level < LEVELS.length-1 ? '' : 'none';
    $('#winOv').classList.add('show');
  }, 1300);
}

function updateHud(){
  const narrow = innerWidth < 380;
  $('#lvl').innerHTML = `${narrow ? '' : '第 '}${level+1} 關<small>${LEVELS[level].name}</small>`;
  $('#fill').textContent = narrow ? `${filled()}/${board.total}` : `🐾 ${filled()} / ${board.total}`;
}

/* ---------- 粒子 ---------- */
function heart(x,y){ for(let k=0;k<3;k++) particles.push({x:x+(Math.random()-.5)*S*.4,y,vx:(Math.random()-.5)*20,vy:-40-Math.random()*30,life:1.2,t:0,kind:'heart',s:S*(.18+Math.random()*.1)}); }
function confetti(){ const cols=['#f27f95','#f5a442','#7cc46a','#6fb3e0','#ffe066'];
  particles.push({x:BX+Math.random()*board.cols*S,y:BY-S*.5,vx:(Math.random()-.5)*160,vy:-150-Math.random()*200,life:2.2,t:0,kind:'conf',
    c:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*6,vr:(Math.random()-.5)*10,s:S*.12}); }

/* ---------- 繪圖 ---------- */
function buildFloor(){
  floorCv = document.createElement('canvas'); floorCv.width = W*DPR; floorCv.height = H*DPR;
  const g = floorCv.getContext('2d'); g.scale(DPR,DPR);
  const R = rng(11), E = Math.PI*2;
  // 池塘水面
  const bg = g.createLinearGradient(0,0,W*.3,H); bg.addColorStop(0,'#74c8d2'); bg.addColorStop(1,'#3b8bab');
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  for(let k=0;k<50;k++){ g.fillStyle = 'rgba(255,255,255,.045)'; g.beginPath();
    g.ellipse(R()*W,R()*H,20+R()*70,8+R()*24,R()*3,0,E); g.fill(); }
  // 小波紋
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 2; g.lineCap = 'round';
  for(let k=0;k<Math.round(W*H/9000);k++){ const x = R()*W, y = R()*H, l = 12+R()*22;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+l/2,y-5,x+l,y); g.quadraticCurveTo(x+l*1.5,y+5,x+l*2,y); g.stroke(); }
  // 荷葉 & 小花
  for(let k=0;k<Math.max(6,Math.round(W*H/45000));k++){
    const x = R()*W, y = R()*H, r = 16+R()*22, a = R()*E;
    g.beginPath(); g.moveTo(x,y); g.arc(x,y,r,a+.28,a+E-.28); g.closePath();
    g.fillStyle = R()<.5 ? '#5fa850' : '#6bb85a'; g.fill(); g.strokeStyle = '#3f7f3a'; g.lineWidth = 1.5; g.stroke();
    g.strokeStyle = 'rgba(40,90,40,.35)'; g.lineWidth = 1;
    for(let v=1; v<6; v++){ const b = a + v/6*E; g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(b)*r*.85,y+Math.sin(b)*r*.85); g.stroke(); }
    if(R()<.35){ for(let q=0;q<6;q++){ const b = q/6*E; g.fillStyle = q%2 ? '#f7b6d0' : '#fbd3e3';
        g.beginPath(); g.ellipse(x+Math.cos(b)*r*.22,y+Math.sin(b)*r*.22,r*.22,r*.1,b,0,E); g.fill(); }
      g.fillStyle = '#ffd95a'; g.beginPath(); g.arc(x,y,r*.1,0,E); g.fill(); }
  }
  const vg = g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(10,45,75,.35)');
  g.fillStyle = vg; g.fillRect(0,0,W,H);
}

function drawRipples(t){
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  for(let k=0;k<6;k++){
    const v = t*.3 + k/6, ph = ((v % 1) + 1) % 1, R = rng(Math.floor(v)*131 + k*7);
    const x = R()*W, y = R()*H;
    ctx.globalAlpha = (1-ph)*.4;
    for(const m of [1,.6]){ ctx.beginPath(); ctx.ellipse(x,y,ph*46*m,ph*20*m,0,0,Math.PI*2); ctx.stroke(); }
  }
  ctx.restore();
}

function drawBoard(t){
  drawRipples(t);
  const pad = S*.42, x = BX-pad, y = BY-pad, w = board.cols*S+pad*2, h = board.rows*S+pad*2, E = Math.PI*2;
  // 小島形狀跟著可放的格子走：水中倒影 → 沙灘邊 → 草地
  const island = (p0,dy) => { const P = new Path2D();
    for(const k of board.on){ const r = Math.floor(k/100), c = k%100; rr(P, BX+c*S-p0, BY+r*S-p0+dy, S+2*p0, S+2*p0, p0*1.5); }
    return P; };
  ctx.fillStyle = 'rgba(15,55,85,.3)'; ctx.fill(island(pad+S*.1, S*.12));
  ctx.fillStyle = '#ecd9a8'; ctx.fill(island(pad+S*.15, 0));
  const G = island(pad, 0);
  ctx.strokeStyle = '#5e9a43'; ctx.lineWidth = S*.1; ctx.stroke(G);
  ctx.fillStyle = '#88c45f'; ctx.fill(G);
  ctx.save(); ctx.clip(G);
  const R = rng(5); ctx.strokeStyle = 'rgba(60,120,45,.55)'; ctx.lineWidth = Math.max(1,S*.025); ctx.lineCap = 'round';
  for(let k=0;k<Math.round(w*h/(S*S)*3);k++){ const gx = x+R()*w, gy = y+R()*h, l = S*.08;
    ctx.beginPath(); ctx.moveTo(gx-l*.6,gy-l); ctx.lineTo(gx,gy); ctx.lineTo(gx+l*.6,gy-l); ctx.stroke(); }
  ctx.restore();
  // 石板格子 & 被包圍的小水窪
  for(let r=0;r<board.rows;r++) for(let c=0;c<board.cols;c++){
    const cx = BX+c*S, cy = BY+r*S;
    if(board.on.has(K(r,c))){
      ctx.beginPath(); rr(ctx,cx+S*.05,cy+S*.08,S*.9,S*.9,S*.18); ctx.fillStyle = '#b9a586'; ctx.fill();
      ctx.beginPath(); rr(ctx,cx+S*.05,cy+S*.04,S*.9,S*.9,S*.18); ctx.fillStyle = '#efe5cf'; ctx.fill();
      ctx.strokeStyle = 'rgba(150,130,100,.5)'; ctx.lineWidth = Math.max(1,S*.02); ctx.stroke();
      const v = (r*31 + c*17) % 5, tk = board.tile.get(K(r,c));
      if(tk) drawTile(tk, cx, cy, t);
      else if(v < 2){ ctx.beginPath(); ctx.moveTo(cx+S*(.25+v*.3),cy+S*.2); ctx.lineTo(cx+S*(.32+v*.3),cy+S*.36); ctx.lineTo(cx+S*(.26+v*.3),cy+S*.5); ctx.stroke(); }
      else if(v === 3){ ctx.fillStyle = 'rgba(120,170,90,.45)'; ctx.beginPath(); ctx.arc(cx+S*.78,cy+S*.78,S*.07,0,E); ctx.arc(cx+S*.7,cy+S*.83,S*.05,0,E); ctx.fill(); }
    } else if([[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b]) => board.on.has(K(r+a,c+b))).length >= 3) drawPuddle(cx+S/2, cy+S/2, S, t, r*3+c);
  }
}
/* 特殊石板：王座、木板、咖哩 */
function drawTile(k, x, y, t){
  const E = Math.PI*2, lw = Math.max(1, S*.03);
  ctx.save(); ctx.lineJoin = 'round';
  if(k === 'T'){
    ctx.beginPath(); rr(ctx, x+S*.1, y+S*.09, S*.8, S*.8, S*.2); ctx.fillStyle = '#c8413a'; ctx.fill();
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = S*.06; ctx.stroke();
    ctx.beginPath(); rr(ctx, x+S*.22, y+S*.21, S*.56, S*.56, S*.14); ctx.fillStyle = '#de5d4f'; ctx.fill();
    ctx.fillStyle = '#f2c14e'; for(const [a,b] of [[.24,.23],[.76,.23],[.24,.75],[.76,.75]]){ ctx.beginPath(); ctx.arc(x+S*a, y+S*b, S*.035, 0, E); ctx.fill(); }
    const cy = y + S*.5, s = S*.15;   // 小皇冠
    ctx.beginPath(); ctx.moveTo(x+S*.5-s*1.2, cy+s*.7); ctx.lineTo(x+S*.5-s*1.2, cy-s*.5); ctx.lineTo(x+S*.5-s*.6, cy+s*.05);
    ctx.lineTo(x+S*.5, cy-s*.8); ctx.lineTo(x+S*.5+s*.6, cy+s*.05); ctx.lineTo(x+S*.5+s*1.2, cy-s*.5); ctx.lineTo(x+S*.5+s*1.2, cy+s*.7); ctx.closePath();
    ctx.fillStyle = '#ffd95a'; ctx.fill(); ctx.strokeStyle = '#a8701c'; ctx.lineWidth = lw; ctx.stroke();
  } else if(k === 'W'){
    ctx.beginPath(); rr(ctx, x+S*.05, y+S*.04, S*.9, S*.9, S*.12); ctx.fillStyle = '#c08a52'; ctx.fill();
    ctx.strokeStyle = '#7d522c'; ctx.lineWidth = lw; ctx.stroke();
    for(const f of [.34,.64]){ ctx.beginPath(); ctx.moveTo(x+S*.07, y+S*f); ctx.lineTo(x+S*.93, y+S*f); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(110,70,35,.45)';
    for(const [f,o] of [[.19,.2],[.49,.55],[.79,.3]]){ ctx.beginPath(); ctx.moveTo(x+S*o, y+S*f); ctx.quadraticCurveTo(x+S*(o+.15), y+S*(f-.05), x+S*(o+.3), y+S*f); ctx.stroke(); }
    ctx.fillStyle = '#5b3a20'; for(const [a,b] of [[.15,.19],[.85,.49],[.15,.79]]){ ctx.beginPath(); ctx.arc(x+S*a, y+S*b, S*.03, 0, E); ctx.fill(); }
  } else if(k === 'C'){
    const cx = x+S*.5, cy = y+S*.55;
    ctx.beginPath(); ctx.ellipse(cx, cy, S*.38, S*.3, 0, 0, E); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.strokeStyle = '#b7aa8c'; ctx.lineWidth = lw; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, S*.3, S*.22, 0, 0, E); ctx.fillStyle = '#fffef8'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.beginPath(); ctx.ellipse(cx+S*.1, cy+S*.02, S*.24, S*.2, 0, 0, E); ctx.fillStyle = '#d98a2b'; ctx.fill();
    for(const [a,b,c] of [[.05,-.05,'#a8561c'],[.18,.06,'#f2b04c'],[.0,.08,'#7cb15a'],[.2,-.08,'#a8561c']]){ ctx.beginPath(); ctx.arc(cx+S*a, cy+S*b, S*.045, 0, E); ctx.fillStyle = c; ctx.fill(); }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = lw; ctx.lineCap = 'round';
    for(const k2 of [-1,1]){ const ph = t*2 + k2; ctx.beginPath(); ctx.moveTo(cx+k2*S*.1, cy-S*.28);

      ctx.quadraticCurveTo(s*u*.48,-u*.28,s*u*.46,-u*(king?.52:.45)); ctx.quadraticCurveTo(s*u*.38,-u*.34,s*u*.14,-u*.2); ctx.closePath();
      ctx.fillStyle = cc; ctx.fill(); ctx.stroke(); }
    if(king) for(const k of [-.13,0,.13]){ ctx.beginPath(); ctx.moveTo(k*u-u*.06,-u*.4); ctx.lineTo(k*u,-u*(k?.53:.58)); ctx.lineTo(k*u+u*.06,-u*.4); ctx.closePath(); ctx.fillStyle = cc; ctx.fill(); ctx.stroke(); }
    else { for(const k of [-.1,.06]){ ctx.beginPath(); ctx.arc(k*u,-u*.43,u*.08,0,E); ctx.fillStyle = cc; ctx.fill(); ctx.stroke(); } }
    ctx.beginPath(); ctx.ellipse(0,-u*.3,u*.27,u*.16,0,0,E); ctx.fillStyle = cc; ctx.fill(); ctx.stroke();
    ctx.fillStyle = dk; for(const [x,y,r] of [[-.15,-.33,.035],[.16,-.27,.03],[.08,-.38,.025]]){ ctx.beginPath(); ctx.arc(x*u,y*u,r*u,0,E); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0,-u*.29,u*.055,0,E); ctx.fillStyle = king ? '#d9482b' : '#46b04a'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-u*.015,-u*.305,u*.015,0,E); ctx.fillStyle = '#fff'; ctx.fill();
  }
}

function drawGhost(){
  if(!drag || !drag.moved) return;
  const p = drag.p; if(!overBoard(p)) return;
  const a = anchorOf(p), ok = legal(p,a.r,a.c);
  for(const [r,c] of p.cells){
    const rr_ = a.r+r, cc = a.c+c;
    if(rr_<0||cc<0||rr_>=board.rows||cc>=board.cols) continue;
    ctx.beginPath(); rr(ctx,BX+cc*S+S*.06,BY+rr_*S+S*.06,S*.88,S*.88,S*.16);
    ctx.fillStyle = ok ? 'rgba(110,210,130,.5)' : 'rgba(240,80,80,.35)'; ctx.fill();
  }
}

function drawTray(){
  const r = trayRect, g = 6;
  ctx.save(); ctx.beginPath(); rr(ctx,r.x-g,r.y-g,r.w+g*2,r.h+g*2,26);
  ctx.fillStyle = 'rgba(240,222,170,.32)'; ctx.fill();
  ctx.setLineDash([3,9]); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}

function drawParticles(dt){
  particles = particles.filter(q => (q.t += dt) < q.life);
  for(const q of particles){
    q.x += q.vx*dt; q.y += q.vy*dt;
    const a = 1 - q.t/q.life;
    fxc.save(); fxc.globalAlpha = Math.max(0,a);
    if(q.kind==='heart'){ q.vy *= .98; fxc.fillStyle = '#ff6f8f'; fxc.font = `bold ${q.s*2}px sans-serif`; fxc.textAlign='center'; fxc.fillText('♥', q.x, q.y); }
    else if(q.kind==='z'){ fxc.fillStyle = '#fff'; fxc.font = `bold ${q.s}px sans-serif`; fxc.textAlign='center'; fxc.fillText('z', q.x + Math.sin(q.t*3)*6, q.y); }
    else { q.vy += 420*dt; q.rot += q.vr*dt; fxc.translate(q.x,q.y); fxc.rotate(q.rot); fxc.fillStyle = q.c; fxc.fillRect(-q.s/2,-q.s/4,q.s,q.s/2); }
    fxc.restore();
  }
}

let last = performance.now(), zTimer = 0;
function frame(now){
  const dt = Math.max(0, Math.min(.05,(now-last)/1000)); last = now; const t = Math.max(0, (now - t0)/1000);
  requestAnimationFrame(frame);
  try {
  for(const p of pieces){
    if(p.delay > 0){ p.delay -= dt; continue; }
    const k = 1 - Math.pow(.0005, dt);
    const isDrag = drag && drag.p===p && drag.moved;
    p.dsc += ((isDrag ? 1 : p.sc) - p.dsc)*k;
    if(isDrag){ drag.lv += (drag.lift - drag.lv)*k; p.y = drag.py - drag.ly*S - drag.lv;
      p.dx = drag.px - drag.lx*S*p.dsc; p.dy = drag.py - drag.ly*S*p.dsc - drag.lv; }
    else { p.dx += (p.x-p.dx)*k; p.dy += (p.y-p.dy)*k; }
    p.rotAnim *= Math.pow(.0004, dt); if(p.rotAnim < .002) p.rotAnim = 0;
    p.sq += dt;
  }
  if(won && (zTimer -= dt) < 0){ zTimer = .35; const p = pieces[Math.floor(Math.random()*pieces.length)];
    if(p.headX) particles.push({x:p.headX+S*.2,y:p.headY-S*.3,vx:10,vy:-30,life:1.8,t:0,kind:'z',s:S*.3}); }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(floorCv) ctx.drawImage(floorCv,0,0,W,H);
  drawTray(); drawBoard(t); drawGhost();
  for(const p of pieces) if(p.placed && !(drag && drag.p===p)) drawCat(p,t,dt);
  for(const p of pieces) if(!p.placed && !(drag && drag.p===p)) drawCat(p,t,dt);
  if(drag) drawCat(drag.p,t,dt);
  fxc.setTransform(DPR,0,0,DPR,0,0); fxc.clearRect(0,0,W,H);
  drawParticles(dt); drawBubbles(dt);
  } catch(err){ console.error(err); }
}

/* ---------- 特效圖層（對話泡泡、愛心、彩帶，畫在呆呆獸上面）---------- */
const fxCv = document.createElement('canvas'); fxCv.id = 'fx'; cv.after(fxCv);
const fxc = fxCv.getContext('2d');
function resizeFx(){ fxCv.width = W*DPR; fxCv.height = H*DPR; fxCv.style.width = W+'px'; fxCv.style.height = H+'px'; }

/* 對話泡泡：抓起來、放好、閒著沒事時講一句符合個性的話 */
let bubbles = [], chatT = 4;
function say(p, kind, text){
  const pe = p.col.pers; if(!pe) return;
  if(!text && kind === 'pick') text = ruleHint(p);
  const forced = !!text;
  if(!text){ const list = pe[kind] || pe.say; text = list[Math.floor(Math.random()*list.length)]; }
  bubbles = bubbles.filter(b => b.p !== p);
  bubbles.push({p, text, t:0, life: forced ? 2.8 : 2.2, delay: kind==='pick' && !forced ? (pe.lag || 0) : 0});
}
function drawBubbles(dt){
  if(!won && (chatT -= dt) < 0){ chatT = 5 + Math.random()*5;
    const idle = pieces.filter(p => p.dsc > .3 && !(drag && drag.p===p)); if(idle.length) say(idle[Math.floor(Math.random()*idle.length)], 'say'); }
  bubbles = bubbles.filter(b => (b.delay > 0 ? (b.delay -= dt, true) : (b.t += dt) < b.life));
  for(const b of bubbles){ if(b.delay > 0 || !b.p.headX) continue;
    const a = Math.min(1, b.t*6, (b.life-b.t)*3), pop = 1 + Math.max(0, .25 - b.t)*1.2;
    const fs = Math.max(12, Math.min(17, S*.24));
    fxc.save(); fxc.globalAlpha = a; fxc.font = `bold ${fs}px "Microsoft JhengHei","PingFang TC",sans-serif`;
    const w = fxc.measureText(b.text).width + fs*1.2, h = fs*1.9;
    let x = b.p.headX - w/2, y = b.p.headY - S*b.p.dsc*.75 - h - 0;
    x = Math.max(6, Math.min(W - w - 6, x)); y = Math.max(56, y);
    fxc.translate(x + w/2, y + h); fxc.scale(pop, pop); fxc.translate(-(x + w/2), -(y + h));
    fxc.beginPath(); rr(fxc, x, y, w, h, h/2); fxc.fillStyle = '#fffaf2'; fxc.fill();
    fxc.strokeStyle = '#4a2e35'; fxc.lineWidth = 2; fxc.stroke();
    const tx = Math.max(x + 12, Math.min(x + w - 12, b.p.headX));
    fxc.beginPath(); fxc.moveTo(tx - 6, y + h - 1); fxc.lineTo(tx, y + h + 8); fxc.lineTo(tx + 6, y + h - 1); fxc.closePath();
    fxc.fill(); fxc.stroke(); fxc.fillStyle = '#fffaf2'; fxc.fillRect(tx - 5, y + h - 3, 10, 3);
    fxc.fillStyle = '#4a2e35'; fxc.textAlign = 'center'; fxc.textBaseline = 'middle'; fxc.fillText(b.text, x + w/2, y + h/2 + 1);
    fxc.restore(); }
}

/* ---------- 輸入 ---------- */
function pick(x,y){
  for(let i=pieces.length-1;i>=0;i--){
    const p = pieces[i], u = S*p.dsc; if(u < 2) continue;
    const c = Math.floor((x-p.dx)/u), r = Math.floor((y-p.dy)/u);
    if(has(p,r,c)) return p;
  }
  return null;
}
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  audioInit(); if(won) return;
  if(drag && drag.moved){ if(e.button===2) rotate(drag.p); return; }
  const p = pick(e.clientX, e.clientY); if(!p) return;
  if(e.button === 2){ const b = snap(); rotate(p); commit(b); return; }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const u = S*p.dsc;
  drag = { p, id:e.pointerId, sx:e.clientX, sy:e.clientY, px:e.clientX, py:e.clientY,
           lx:(e.clientX-p.dx)/u, ly:(e.clientY-p.dy)/u, moved:false, lv:0,
           // 手指會擋住呆呆獸：觸控拖曳時把牠往上抬，讓手指在牠下面
           lift: e.pointerType === 'touch' ? (dims(p).h - (e.clientY-p.dy)/u + .6)*S : 0 };
  pieces.splice(pieces.indexOf(p),1); pieces.push(p);
});
cv.addEventListener('pointermove', e => {
  if(!drag){ const h = won ? null : pick(e.clientX,e.clientY); cv.style.cursor = h ? 'grab' : 'default'; hover = h; return; }
  if(e.pointerId !== drag.id) return;
  drag.px = e.clientX; drag.py = e.clientY;
  if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 6){
    drag.moved = true; cv.style.cursor = 'grabbing'; drag.before = snap();
    if(drag.p.placed){ drag.p.placed = null; updateHud(); }
    sfx.pick(drag.p.col.pers && drag.p.col.pers.pitch); say(drag.p,'pick');
  }
  if(drag.moved){ const p = drag.p; p.x = drag.px - drag.lx*S; p.y = drag.py - drag.ly*S - drag.lv; }
});
function endDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; cv.style.cursor = 'default';
  const p = d.p;
  if(!d.moved){ const b = snap(); rotate(p); commit(b); return; }
  p.x = d.px - d.lx*S; p.y = d.py - d.ly*S - d.lv;
  moves++;
  const a = anchorOf(p), geo = overBoard(p) && fits(p,a.r,a.c), why = geo ? ruleFail(p,a.r,a.c) : null;
  if(geo && !why) place(p,a.r,a.c);
  else { if(overBoard(p)) sfx.bad(); if(why) say(p,'rule',why); sendHome(p); p.sq = 0; updateHud(); }
  commit(d.before);
}
function rotateWrap(p){ if(drag && drag.p === p){ rotate(p); return; } const b = snap(); rotate(p); commit(b); }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => { e.preventDefault(); const p = (drag && drag.p) || hover; if(p) rotateWrap(p); }, {passive:false});
addEventListener('keydown', e => {
  if(e.key==='r' || e.key==='R' || e.key===' '){ const p = (drag && drag.p) || hover; if(p){ e.preventDefault(); rotateWrap(p); } }
  if((e.ctrlKey || e.metaKey) && (e.key==='z' || e.key==='Z')){ e.preventDefault(); undo(); }
});
addEventListener('resize', () => { if(board){ updateHud(); setTip(); layout(false); } });

/* ---------- 介面按鈕 ---------- */
$('#bReset').onclick = () => { audioInit(); loadLevel(level); };
$('#bHint').onclick = () => { audioInit(); const b = snap(); hint(); if(!won) commit(b); };
$('#bUndo').onclick = () => { audioInit(); undo(); };
$('#bRule').onclick = () => $('#ruleOv').classList.remove('show');
$('#bSound').onclick = () => { muted = !muted; $('#bSound').textContent = muted ? '🔇' : '🔊'; };
$('#bAgain').onclick = () => loadLevel(level);
$('#bNext').onclick = () => loadLevel(Math.min(LEVELS.length-1, level+1));
$('#bClose').onclick = () => $('#menuOv').classList.remove('show');
$('#bMenu').onclick = () => {
  const g = $('#grid'); g.innerHTML = '';
  LEVELS.forEach((L,i) => {
    const b = document.createElement('button'), locked = i >= progress.unlocked, st = progress.stars[i]||0;
    b.disabled = locked; if(st) b.className = 'done';
    b.innerHTML = `${locked ? '🔒' : i+1}<small>${locked ? '???' : L.name}</small><small>${'⭐'.repeat(st)}</small>`;
    b.onclick = () => { $('#menuOv').classList.remove('show'); loadLevel(i); };
    g.appendChild(b);
  });
  $('#menuOv').classList.add('show');
};

loadLevel(Math.min(progress.unlocked-1, LEVELS.length-1));
requestAnimationFrame(frame);
})();
</script>
